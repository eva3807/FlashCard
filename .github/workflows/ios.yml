name: Build unsigned iOS IPA

# AltStore が自分の Apple ID で再署名するため、ここでは一切署名しない。
# よって証明書も Apple Developer Program（年99ドル）も不要。
on:
  push:
    branches: [main]
    # ドキュメントだけの変更で10分のビルドを回さない。
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# Release を作るために必要。
permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - run: flutter pub get

      # iOS ビルドは10分近くかかるので、先に安いチェックで落とす。
      - run: flutter analyze
      - run: flutter test

      # --no-codesign: 署名なしで Runner.app を生成する
      - run: flutter build ios --release --no-codesign

      # .ipa は「Payload/ に .app を入れて zip したもの」でしかない。
      # zip の -y（symlink 保存）は iOS では実質不要（フレームワークがフラット構造で
      # symlink を含まない）だが、無害なので防御的に付けてある。
      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -qry FlashCard.ipa Payload
          ls -lh FlashCard.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FlashCard-ipa
          path: build/ios/iphoneos/FlashCard.ipa
          if-no-files-found: error

      # Actions のアーティファクトは GitHub にログインしないと落とせず、90日で消える。
      # Release のアセットにすると「ログイン不要・期限なし・固定URL」になり、
      # iPhone の Safari から直接ダウンロードして AltStore に渡せる。
      #   https://github.com/<owner>/<repo>/releases/latest/download/FlashCard.ipa
      - name: Publish the IPA as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        # --notes は1行に収めること。YAML のブロックスカラーは字下げが浅い行で
        # 終わるので、途中に空行や行頭から始まる行を入れると run がそこで切れる。
        # （切れても yaml パーサは通ってしまい、GitHub 側で初めて弾かれる）
        run: |
          gh release create "build-${{ github.run_number }}" \
            build/ios/iphoneos/FlashCard.ipa \
            --repo "${{ github.repository }}" \
            --title "FlashCard build ${{ github.run_number }}" \
            --notes "署名なし .ipa（コミット ${{ github.sha }}）。AltStore / AltServer が本人の Apple ID で再署名して入れる。" \
            --latest
